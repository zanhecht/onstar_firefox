<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OnStar Auth Token Saver</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f0f4f9;
        color: #1a1a2e;
        width: 290px;
      }
      .header {
        background: #0060df;
        color: #fff;
        padding: 1rem 1.1rem 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }
      .header svg {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
      }
      .header-text h1 {
        font-size: 0.88rem;
        font-weight: 700;
        line-height: 1.2;
      }
      .header-text p {
        font-size: 0.72rem;
        opacity: 0.85;
        margin-top: 1px;
      }
      .body {
        padding: 1rem 1.1rem 0.9rem;
      }
      button {
        display: block;
        width: 100%;
        padding: 0.55rem 0;
        font-size: 0.88rem;
        font-weight: 700;
        cursor: pointer;
        background: #0060df;
        color: #fff;
        border: none;
        border-radius: 6px;
        letter-spacing: 0.01em;
        transition: background 0.15s;
      }
      button:hover:not(:disabled) {
        background: #0050bb;
      }
      button:disabled {
        background: #9ab5e0;
        cursor: default;
      }
      .secondary {
        margin-top: 0.45rem;
        background: #e7edf6;
        color: #16335b;
      }
      .secondary:hover:not(:disabled) {
        background: #dce6f4;
      }
      #flowStatus {
        font-size: 0.76rem;
        margin-top: 0.5rem;
        min-height: 1em;
        text-align: center;
        word-break: break-word;
      }
      #flowStatus.err {
        color: #c0392b;
      }
      #flowStatus.ok {
        color: #27ae60;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="18" cy="22" r="9" fill="none" stroke="#fff" stroke-width="3" />
        <circle cx="18" cy="22" r="4" fill="#0060df" />
        <path d="M26 22h14" stroke="#fff" stroke-width="3" stroke-linecap="round" />
        <path d="M36 22v6M31 22v5" stroke="#fff" stroke-width="3" stroke-linecap="round" />
      </svg>
      <div class="header-text">
        <h1>OnStar Auth Token Saver</h1>
        <p>GM / MyChevrolet OAuth helper</p>
      </div>
    </div>
    <div class="body">
      <button id="launchBtn">Launch Auth Flow</button>
      <button id="openLogBtn" class="secondary">View Capture Log</button>
      <div id="flowStatus" aria-live="polite"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
